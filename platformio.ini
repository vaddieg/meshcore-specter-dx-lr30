; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:specter]
platform = ststm32
board = genericSTM32F103CB
framework = arduino
upload_protocol = serial
upload_port = /dev/cu.usbserial-10
upload_speed = 115200
upload_flags = 
	-i
	dtr,-rts,rts:-dtr,-rts,rts
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-10
lib_deps = 
	https://github.com/jgromes/RadioLib.git#master
	rweather/Crypto @ ^0.4.0
build_flags = 
	-D HAL_UART_MODULE_ENABLED
	-D ENABLE_HWSERIAL1
	-D RADIOLIB_STATIC_ONLY=1
    -D NODE_NAME_STR=\"DE.BW.LB-Bi-Bi.STM32\"
	-D NODE_LAT_I=48961945
	-D NODE_LON_I=9129164
	-O2

[env:specter_repeater]
platform = ststm32
board = genericSTM32F103CB
framework = arduino
upload_protocol = serial
upload_port = /dev/ttyUSB1
upload_speed = 115200
monitor_speed = 115200
monitor_port = /dev/ttyUSB1
upload_flags = 
	-i
	dtr,-rts,rts:-dtr,-rts,rts
lib_deps = 
	https://github.com/jgromes/RadioLib.git#master
	rweather/Crypto @ ^0.4.0
build_flags = 
	-D HAL_UART_MODULE_ENABLED
	-D ENABLE_HWSERIAL1
	-D RADIOLIB_STATIC_ONLY=1
	-D NODE_NAME_STR=\"DE.BW.LB-Bi-Bi.STM32\"
	-D NODE_LAT_I=48961945
	-D NODE_LON_I=9129164
	-O2
